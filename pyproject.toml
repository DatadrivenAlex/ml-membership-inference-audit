[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ml-membership-inference-audit"
version = "0.1.0"
description = "Offline shadow-model membership-inference risk audit for tabular classifiers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alexandru Cojocari" }]
dependencies = [
  "numpy>=1.24,<3",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
miaudit = "miaudit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["miaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
